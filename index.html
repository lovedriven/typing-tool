<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLP ICT Keyboard Trainer – LoveDriven Ministries</title>
<style>
:root{--navy:#12313f;--teal:#34a98f;--coral:#e8553a;--gold:#f5b942;--line:#d6e6e3;--ks:clamp(24px,3.4vw,54px)}
*{box-sizing:border-box}
html{font-size:clamp(15px,.9vw + 9px,21px)}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--navy);background:linear-gradient(135deg,#0f2a36 0%,#16505a 48%,#2a8f7c 100%) fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body:before{width:40vmax;height:40vmax;background:#e8553a;top:-14vmax;left:-12vmax}
body:after{width:38vmax;height:38vmax;background:#34a98f;bottom:-14vmax;right:-10vmax;animation-delay:-6s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.15)}}
#app{width:min(1300px,96vw);margin:0 auto;padding:1.1rem 0 3rem}
.card{background:#ffffffee;backdrop-filter:blur(8px);border-radius:1.4rem;padding:clamp(1rem,2vw,1.8rem);box-shadow:0 10px 40px #0a1f2840;margin-bottom:1.1rem;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.center{text-align:center}.auth{width:min(560px,96vw);margin:0 auto}
.logo{width:clamp(110px,14vw,170px);height:auto;filter:drop-shadow(0 4px 10px #0004)}.lg{width:4rem;height:4rem;object-fit:contain}
h1{font-size:1.5rem;margin:.3rem 0}h2{font-size:1.2rem;margin:0 0 .6rem}.auth h1,.auth .sub{color:#fff}
.sub{color:#9be8d4;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 .8rem;font-size:.85rem}
.tabs{display:flex;gap:.4rem;background:#e6f1ef;padding:.3rem;border-radius:999px;margin-bottom:.6rem}.tabs button{flex:1;background:none;color:var(--navy);box-shadow:none;padding:.5rem}.tabs .on{background:var(--navy);color:#fff}
label{display:block;font-size:.8rem;font-weight:700;margin:.8rem 0 .2rem}
input{width:100%;padding:.7rem .9rem;border:2px solid var(--line);border-radius:.9rem;font:inherit;background:#fff}input:focus{outline:3px solid #34a98f66;border-color:var(--teal)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.6rem 1.3rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3cc0a3,#2b8c8f);box-shadow:0 4px 0 #1f7a6a;transition:.15s}
button:hover{transform:translateY(-2px);filter:brightness(1.05)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #1f7a6a}button:disabled{cursor:not-allowed}
.alt{background:linear-gradient(135deg,#1d4a5c,#12313f);box-shadow:0 4px 0 #0a1c25}.warn{background:linear-gradient(135deg,#f0734f,#e8553a);box-shadow:0 4px 0 #b83d24}
.full{width:100%;margin-top:1rem}.link{background:none;box-shadow:none;color:var(--coral);text-decoration:underline;padding:.3rem}.link:hover{transform:none}
#m{margin-top:.7rem;font-weight:700;color:var(--coral);min-height:1.2rem}#m.ok{color:var(--teal)}
.caution{background:#fff4f1;border-left:5px solid var(--coral);padding:.7rem .9rem;border-radius:.8rem;font-size:.8rem;margin-top:.9rem}
.bar,.prog{height:.55rem;border-radius:9px;background:#e3ecea;margin-top:.4rem;overflow:hidden}.bar i,.prog i{display:block;height:100%;width:0;transition:.25s;background:linear-gradient(90deg,var(--teal),var(--gold))}
#pp{width:4rem;height:4rem;border-radius:50%;object-fit:cover;display:none;margin-top:.4rem}
.top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}.top .sp{flex:1}
.av{width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;border:3px solid #fff;box-shadow:0 3px 10px #0003}
.hero{background:linear-gradient(120deg,#12313f,#1d6f73 60%,#34a98f);color:#fff}.hero h1{margin:0}.hero small{opacity:.85}.hero .prog{background:#ffffff33;height:.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem}
.les{background:linear-gradient(135deg,#fff,#eaf7f3);color:var(--navy);border:2px solid var(--line);border-radius:1.1rem;box-shadow:0 4px 0 #cfe0dd;padding:1rem;text-align:center;font-size:1rem}
.les span{display:block;font-size:2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.8rem;margin:.9rem 0}.tiles>div{background:linear-gradient(135deg,#eaf7f3,#fff);border:2px solid var(--line);border-radius:1.1rem;padding:.6rem;text-align:center}
.tiles span{font-size:1.3rem}.tiles b{display:block;font-size:clamp(1.5rem,2.4vw,2.2rem);color:var(--coral);line-height:1.1}.tiles small{color:#5d7a80;font-weight:600}
.world{border-radius:1.3rem;padding:1rem 1.2rem 1.2rem;margin-bottom:.9rem;background:linear-gradient(135deg,var(--w1),var(--w2));color:#fff;box-shadow:0 6px 20px #0003}
.world h3{margin:0 0 .7rem;display:flex;align-items:center;gap:.6rem;font-size:1.15rem}.world h3>span:first-child{font-size:1.6rem}
.dif{font-size:.7rem;background:#ffffff40;padding:.2rem .7rem;border-radius:99px;margin-left:auto}
.nodes{display:flex;flex-wrap:wrap;gap:.8rem}
.node{width:6.6rem;min-height:5.6rem;border-radius:1.2rem;background:#fff;color:var(--navy);box-shadow:0 5px 0 #0003;padding:.45rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.68rem;line-height:1.15;gap:.1rem}
.node b{font-size:1.4rem}.node.cur{animation:pu 1.4s infinite}.node.lock{background:#ffffff38;color:#fffc;box-shadow:none}
@keyframes pu{50%{transform:scale(1.08);box-shadow:0 5px 0 #0003,0 0 0 7px #fff6}}
.stars{color:var(--gold);font-size:1rem;letter-spacing:.05em}
.bdg{display:inline-block;font-size:.75rem;padding:.3rem .8rem;border-radius:99px;background:#e6eceb;color:#7b8c90;margin:.15rem}.bdg.on{background:#fff0c9;color:#7a5200;font-weight:700}
.verse{background:linear-gradient(135deg,#fff8e6,#fff);border-left:6px solid var(--gold);font-size:1.05rem;font-style:italic}.verse b{font-style:normal;color:var(--coral)}
.note{background:#eaf7f3;border-left:5px solid var(--teal);padding:.5rem .9rem;border-radius:.8rem;font-size:.85rem;margin:.6rem 0}
.tg{display:inline-flex;align-items:center;gap:.3rem;margin:0;font-weight:600;font-size:.85rem}.tg input{width:auto}
.txt{font:clamp(1.4rem,2.7vw,2.7rem)/1.75 Consolas,"Courier New",monospace;background:#fff;border:3px solid var(--line);border-radius:1.2rem;padding:clamp(.8rem,2vw,1.6rem);word-break:break-word;user-select:none;margin-top:.7rem;transition:.1s}
.txt span{padding:.02em 0}.txt span.d{color:var(--teal)}.txt span.c{background:var(--coral);color:#fff;border-radius:.2em;animation:bl 1s infinite}@keyframes bl{50%{background:#f0734f}}
.txt.bad{border-color:var(--coral);animation:sh .15s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fh{text-align:center;font-size:clamp(1rem,1.5vw,1.4rem);margin:.5rem 0}
#kbw{margin-top:.8rem;overflow-x:auto}.kbd{display:table;margin:0 auto}
.kr{display:flex;gap:.25rem;margin-top:.25rem}
.k{min-width:var(--ks);height:var(--ks);display:flex;align-items:center;justify-content:center;border:2px solid;border-radius:.5rem;font:700 calc(var(--ks)*.38) Consolas,monospace;position:relative;flex:0 0 auto;background:#fff;transition:.1s}
.k.sp{min-width:calc(var(--ks)*6)}.k.sh{min-width:calc(var(--ks)*1.8);background:#8aa0a633;border-color:#8aa0a6;font-size:calc(var(--ks)*.28)}
.k u{position:absolute;bottom:12%;width:30%;border-bottom:3px solid}
.k.nx{background:#12313f!important;color:#fff;transform:scale(1.14);box-shadow:0 0 0 4px var(--coral);z-index:2}
.hands{display:flex;justify-content:center;align-items:flex-end;gap:clamp(1rem,8vw,9rem);margin-top:.8rem}
.hand{width:clamp(110px,17vw,250px);height:auto;overflow:visible}
.fin{fill:var(--c);fill-opacity:.28;stroke:var(--c);stroke-width:3;transition:.15s}
.fin.on{fill-opacity:1;filter:drop-shadow(0 0 9px var(--c));transform:translateY(-10px)}.fin.on2{fill-opacity:.8;transform:translateY(-6px)}
.lt{font:800 15px Consolas,monospace;fill:var(--navy);text-anchor:middle;pointer-events:none}.fin.on+.lt,.fin.on2+.lt{fill:#fff}
.palm{fill:#e8f0f1;stroke:#b3c8cc;stroke-width:3}.cap{font:700 12px "Segoe UI";fill:#7b9ca3;text-anchor:middle;letter-spacing:.2em}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.8rem}.legend span{border:2px solid;border-radius:.6rem;padding:.2rem .6rem;font-size:.75rem;font-weight:600}
.res h1{font-size:1.8rem}.big{font-size:clamp(3rem,7vw,5rem);letter-spacing:.1em}.st{color:#d7e0e0;display:inline-block}.st.f{color:var(--gold);animation:sp .6s both}@keyframes sp{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem;justify-content:center}.row button{flex:1 1 9rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:.55rem;border-bottom:1px solid var(--line);text-align:left}th{background:var(--navy);color:#fff}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:50;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#mod{position:fixed;inset:0;background:#0a1f28cc;display:flex;align-items:center;justify-content:center;z-index:60;padding:1rem}.mbox{background:#fff;border-radius:1.4rem;padding:1.5rem;width:min(430px,96vw);display:flex;flex-direction:column;gap:.6rem;animation:pop .25s}
#print{display:none}
@media(max-width:560px){.hands{display:none}.node{width:5.2rem}}
@media print{body{background:#fff!important}body:before,body:after,#mod{display:none}body>#app{display:none}#print{display:block;padding:20px;font-size:13px}#print td,#print th{border:1px solid #999;padding:5px}#print th{background:#12313f;color:#fff}}
</style></head><body><div id="app"></div><div id="print"></div>

function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!='SLP')throw 0;let a=0,m=0;
 for(const k in d.u){const x=d.u[k];if(!x.h||!x.s||!Array.isArray(x.ss))continue;if(!db.u[k]){db.u[k]=x;a++}else{const have=new Set(db.u[k].ss.map(s=>s.t));x.ss.forEach(s=>{if(!have.has(s.t)){db.u[k].ss.push(s);m++}});db.u[k].ss.sort((p,q)=>p.t-q.t);db.u[k].pp=Math.max(db.u[k].pp||0,x.pp||0);for(const q in x.lv||{}){db.u[k].lv=db.u[k].lv||{};db.u[k].lv[q]=Math.max(db.u[k].lv[q]||0,x.lv[q])}}}
 save();msg(`Imported: ${a} new account(s), ${m} new session(s).`,1);inp.value=''}catch(e){msg('That is not a valid SLP backup file.')}};r.readAsText(f)}
/* ---------- Admin ---------- */
function admin(){if(AD)return panel();
 show(`<div class="auth">${head}<div class="card"><h2>Admin (${ADM})</h2>${db.a?'<label>Admin passcode</label><input id="ap" type="password" onkeydown="if(event.key==\'Enter\')adminIn()"><button class="full" onclick="adminIn()">Open admin panel</button>':'<p style="font-size:14px">First time: set an admin passcode for this computer.</p><label>New passcode</label><input id="ap" type="password" data-b="b3" oninput="meter(this)"><div class="bar"><i id="b3"></i></div><label>Confirm</label><input id="ap2" type="password"><button class="full" onclick="adminSet()">Save passcode</button>'}<div id="m"></div><p class="center"><button class="link" onclick="auth()">Back</button></p></div></div>`)}
async function adminSet(){const p=$('#ap').value;if(issues(p).length)return msg('Passcode needs: '+issues(p).join(', ')+'.');if(p!==$('#ap2').value)return msg('Passcodes do not match.');const s=salt();db.a={s,h:await hash(p,s)};save();AD=true;panel()}
async function adminIn(){if(await hash($('#ap').value,db.a.s)!==db.a.h)return msg('Wrong passcode.');AD=true;panel()}
function panel(){const us=Object.entries(db.u);
 show(`<div class="card"><div class="top"><h2 style="margin:0">Admin panel</h2><div class="sp"></div><button class="alt" onclick="AD=false;auth()">Log out</button></div><div id="m"></div><div id="code"></div><div style="overflow-x:auto"><table><tr><th>Name</th><th>Username</th><th>Phone</th><th>Sessions</th><th></th></tr>${us.map(([n,u])=>`<tr><td>${esc(u.n)}</td><td>${esc(n)}</td><td>${esc(u.ph)}</td><td>${u.ss.length}</td><td><button onclick="genCode('${esc(n)}')">Reset code</button> <button class="warn" onclick="delU('${esc(n)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5>No accounts.</td></tr>'}</table></div><div class="row"><button class="alt" onclick="exp(1)">Export ALL accounts</button><button class="alt" onclick="$('#imp').click()">Import backup</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>`)}
async function genCode(n){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',u=db.u[n];let c='';crypto.getRandomValues(new Uint8Array(8)).forEach(x=>c+=A[x%A.length]);
 u.rc={h:await hash(c,u.s),x:Date.now()+1800000};save();
 $('#code').innerHTML=`<div class="caution" style="background:#eaf7f3;border-color:#34a98f">Reset code for <b>${esc(u.n)}</b> (valid 30 min, one use):<div style="font:700 30px Consolas;letter-spacing:4px">${c}</div>Give it to the student in person or by phone/SMS. <button class="link" onclick="sendOpts('Reset code for ${esc(n)}','Code: ${c} (valid 30 minutes)')">Email a copy to admin</button></div>`}
function delU(n){if(confirm('Delete account "'+n+'" and all its sessions? Export a backup first.')){delete db.u[n];save();panel()}}
if(!window.crypto||!crypto.subtle){document.body.innerHTML='<h2 style="padding:20px">Please open this file in Microsoft Edge or Google Chrome.</h2>'}else auth();
</script></body></html>
