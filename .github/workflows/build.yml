name: Build Windows and Mac apps
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html is the new version
        shell: bash
        run: |
          ls -l index.html
          grep -q "Version 2.1" index.html || { echo "ERROR: index.html in the repository is the OLD version. Upload the new index.html."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SLP-Keyboard-Trainer-${{ matrix.os }}-run${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.dmg
